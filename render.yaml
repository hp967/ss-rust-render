# ================================
# SS-Rust Render 部署配置
# ================================

name: ss-rust-render

# 使用 Private Service 类型，不要求 HTTP 健康检查
# （ssserver 是 TCP 代理服务，不是 Web 服务）
type: private-service

# 环境变量
envVars:
  - key: SS_SERVER_PORT
    value: "8388"

  # SS_PASSWORD 必须在 Render Dashboard → Environment
  # 设置为 Secret 类型，不能写死在文件里
  # Secret name: SS_PASSWORD  value: <你的Shadowsocks密码>

  - key: SS_METHOD
    value: aes-256-cfb

# CPU / RAM
resources:
  cpu: 0.1
  memory: 512MB

autoDeploy: true

# 定制启动命令，使用环境变量
cmd: /usr/local/bin/ssserver -s 0.0.0.0:${SS_SERVER_PORT} -k ${SS_PASSWORD} -m ${SS_METHOD}
